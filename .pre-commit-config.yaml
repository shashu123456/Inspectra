repos:
  - repo: local
    hooks:
      - id: inspectra
        name: Inspectra security scan
        entry: inspectra scan
        language: python
        types: [text]
        args: ["--yes", "--skip-ports", "--allow-private", "--authorized", "--allow-insecure", "--quiet"]
        additional_dependencies: ["inspectra-cli>=2.3.0"]
