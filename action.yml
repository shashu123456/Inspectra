name: Inspectra Scan
description: Run Inspectra passive security scan and upload SARIF to GitHub Code Scanning
inputs:
  target:
    description: Target URL or hostname to scan
    required: true
  fail-on:
    description: Minimum severity for new findings to fail the scan (none|low|medium|high)
    default: "high"
    required: false
  baseline:
    description: Path to baseline JSON file for diff comparison
    default: ""
    required: false
  rules-dir:
    description: Directory containing custom check modules (repeatable via multiple inputs not supported; use comma-separated)
    default: ""
    required: false
branding:
  icon: shield
  color: purple
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
      shell: bash
    - run: |
        BASELINE_ARGS=""
        if [ -n "${{ inputs.baseline }}" ]; then
          BASELINE_ARGS="--baseline ${{ inputs.baseline }}"
        fi
        RULES_DIR_ARGS=""
        if [ -n "${{ inputs.rules-dir }}" ]; then
          RULES_DIR_ARGS="--rules-dir ${{ inputs.rules-dir }}"
        fi
        inspectra scan "${{ inputs.target }}" --yes --skip-ports --allow-private --authorized --allow-insecure --directories --format sarif -o inspectra.sarif --fail-on "${{ inputs.fail-on }}" $BASELINE_ARGS $RULES_DIR_ARGS
      shell: bash
    - uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: inspectra.sarif
