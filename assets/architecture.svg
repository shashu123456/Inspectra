<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
  </defs>
  <!-- 1. Safety gate -->
  <rect x="60" y="160" width="260" height="200" fill="#0a0a0a" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="190" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="700" fill="#eaeaea">Safety gate</text>
  <text x="190" y="260" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">DNS pinned &middot; private blocked</text>
  <text x="190" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">--authorized consent</text>
  <!-- 2. Checks -->
  <rect x="340" y="160" width="260" height="200" fill="#0a0a0a" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="470" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="700" fill="#eaeaea">Checks</text>
  <text x="470" y="260" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">DNS, TLS, HTTP, headers</text>
  <text x="470" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">robots, directories, ports</text>
  <!-- 3. Findings -->
  <rect x="620" y="160" width="260" height="200" fill="#0a0a0a" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="750" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="700" fill="#eaeaea">Findings</text>
  <text x="750" y="260" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">rule-id, severity, evidence</text>
  <text x="750" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">evidence_hash per finding</text>
  <!-- 4. Risk -->
  <rect x="900" y="160" width="260" height="200" fill="#0a0a0a" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="1030" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="700" fill="#eaeaea">Risk</text>
  <text x="1030" y="260" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">severity x confidence</text>
  <text x="1030" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">posture score &amp; grade</text>
  <!-- 5. Report -->
  <rect x="1180" y="160" width="360" height="200" fill="#0a0a0a" stroke="#06b6d4" stroke-width="2" rx="8"/>
  <text x="1360" y="220" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="700" fill="#eaeaea">Report</text>
  <text x="1360" y="260" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">JSON, Markdown, HTML</text>
  <text x="1360" y="284" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" fill="#9ca3af">SARIF, baseline diff</text>
  <!-- arrows -->
  <path d="M320 260 H340" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 260 H620" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M880 260 H900" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 260 H1180" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
