<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <!-- Inspectra banner, dark variant -->
  <rect width="1600" height="400" fill="#0a0a0a"/>
  <!-- subtle scan rings -->
  <circle cx="260" cy="200" r="150" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.15"/>
  <circle cx="1340" cy="320" r="200" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.08"/>
  <!-- mark -->
  <g transform="translate(110, 60)">
    <rect width="280" height="280" rx="56" fill="#141414"/>
    <circle cx="140" cy="140" r="100" fill="none" stroke="#06b6d4" stroke-width="7" stroke-dasharray="62 26"/>
    <circle cx="140" cy="140" r="32" fill="none" stroke="#06b6d4" stroke-width="5"/>
    <line x1="174" y1="174" x2="232" y2="232" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="140" r="9" fill="#06b6d4"/>
  </g>
  <!-- wordmark -->
  <text x="430" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="112" font-weight="800" fill="#eaeaea" letter-spacing="-14">inspectra</text>
  <rect x="430" y="242" width="640" height="6" fill="#06b6d4" rx="3"/>
  <!-- tagline -->
  <text x="430" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#9ca3af"
        letter-spacing="2">Passive security assessment  &middot;  SSRF-safe  &middot;  Deterministic replay</text>
</svg>
