<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Inspectra social preview (1280x640) -->
  <rect width="1280" height="640" fill="#0a0a0a"/>
  <circle cx="200" cy="320" r="180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.15"/>
  <circle cx="1080" cy="520" r="240" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.07"/>
  <!-- mark -->
  <g transform="translate(90, 90)">
    <rect width="460" height="460" rx="92" fill="#141414"/>
    <circle cx="320" cy="320" r="164" fill="none" stroke="#06b6d4" stroke-width="11" stroke-dasharray="102 42"/>
    <circle cx="320" cy="320" r="52" fill="none" stroke="#06b6d4" stroke-width="8"/>
    <line x1="284" y1="284" x2="380" y2="380" stroke="#06b6d4" stroke-width="9" stroke-linecap="round"/>
    <circle cx="320" cy="320" r="15" fill="#06b6d4"/>
  </g>
  <!-- wordmark -->
  <text x="590" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="150" font-weight="800" fill="#eaeaea" letter-spacing="-20">inspectra</text>
  <rect x="590" y="370" width="520" height="8" fill="#06b6d4" rx="4"/>
  <!-- tagline -->
  <text x="590" y="480" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#9ca3af"
        letter-spacing="3">Passive security assessment  &middot;  SSRF-safe  &middot;  Deterministic replay</text>
  <text x="590" y="530" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#6b7280"
        letter-spacing="1">inspectra-cli  &middot;  PyPI  &middot;  GitHub Actions</text>
</svg>
