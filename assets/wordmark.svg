<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120">
  <!-- Inspectra wordmark: "inspectra" in mono, tight tracking, beside the mark -->
  <defs>
    <clippath id="mark-clip">
      <rect width="112" height="112" rx="22" x="8" y="4"/>
    </clippath>
  </defs>
  <!-- mark -->
  <g clip-path="url(#mark-clip)">
    <rect width="112" height="112" rx="22" fill="#0a0a0a"/>
    <circle cx="64" cy="64" r="42" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="26 11"/>
    <circle cx="64" cy="64" r="14" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <line x1="82" y1="82" x2="104" y2="104" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="4" fill="#06b6d4"/>
  </g>
  <!-- wordmark: mono, tight tracking -->
  <text x="140" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="56" font-weight="700" fill="#eaeaea" letter-spacing="-6">inspectra</text>
  <!-- accent underline -->
  <rect x="140" y="88" width="260" height="3" fill="#06b6d4" rx="1.5"/>
</svg>
