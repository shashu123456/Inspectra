<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Logo mark: shield with eye -->
  <g transform="translate(6,6)">
    <!-- shield -->
    <path d="M60 6 L114 6 L114 6 L78 128 L42 128 Z"
          fill="url(#shieldGrad)" stroke="#0c4a6e" stroke-width="3" stroke-linejoin="round"/>
    <!-- inner shield highlight -->
    <path d="M66 12 L108 12 L76 120 L50 120 Z"
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- eye outer -->
    <path d="M60 62 Q78 40 96 62 Q78 84 60 62 Z"
          fill="#0c4a6e" stroke="#075985" stroke-width="1.5"/>
    <!-- eye pupil -->
    <circle cx="78" cy="62" r="9" fill="url(#eyeGrad)"/>
    <circle cx="78" cy="62" r="4" fill="#0c4a6e"/>
    <!-- scan line accent -->
    <path d="M52 6 L96 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="78" cy="62" r="16" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <g fill="#f8fafc" font-family="Georgia, 'Times New Roman', serif">
    <text x="130" y="58" font-size="46" font-weight="bold" letter-spacing="1">Inspectra</text>
    <text x="132" y="92" font-size="16" fill="#94a3b8" letter-spacing="3">EXPLAINABLE SECURITY ASSESSMENT</text>
  </g>

  <!-- Tagline accent -->
  <g fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2">
    <text x="132" y="116">INSPECT · OBSERVE · ASSESS · EXPLAIN · REPORT</text>
  </g>
</svg>