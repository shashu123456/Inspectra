[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspectra-cli"
description = "An open-source, explainable security assessment framework for safe and authorized security analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inspectra contributors" }]
keywords = ["security", "vulnerability-assessment", "security-audit", "cli", "python"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "cryptography>=42.0",
  "dnspython>=2.4.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "python-nmap>=0.7.1",
  "rich>=13.7.0",
]
version = "2.0.0"

[project.optional-dependencies]
dev = [
  "mypy>=1.8.0",
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-httpserver>=1.0.0",
  "ruff>=0.2.0",
]

[project.scripts]
inspectra = "inspectra.cli:main"
inspectra-cli = "inspectra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspectra"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

# Strict function typing is enforced on src/ only. Tests are excluded:
# pytest fixtures are untyped from mypy's perspective and the suite uses
# duck-typed fakes by design; behavior there is covered by pytest.

[[tool.mypy.overrides]]
module = ["nmap", "nmap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=inspectra --cov-report=term-missing"